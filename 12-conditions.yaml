- name: conditions
  hosts: web
  become: yes
  tasks:
  - name: check user exist or not
    ansible.builtin.command: id expense
    register: USER # id expense value stored in USER
    ignore_errors: true

  - name: print user information
    ansible.builtin.debug:
      msg: "User info is {{USER}}" # above USER gets printed here

  - name: create user
    ansible.builtin.command: useradd expense
    when: USER.rc != 0 # condition if USER expense exists rc will be 0 otherwise more than 0

  - name: say Hello
    ansible.builtin.debug:
      msg: "Hello"