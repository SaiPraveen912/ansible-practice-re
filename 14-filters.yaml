- name: default value
  hosts: localhost
  tasks:
  - name: print default value
    ansible.builtin.debug:
      msg: "Hello {{course | default('Ansible') }}" # | default('ansible') --> Provide default value in case you forget

- name: upper case
  hosts: localhost
  vars:
    greeting: "Hello, Good Morning"
  tasks:
  - name: convert into uppercase
    ansible.builtin.debug:
      msg: "{{ greeting | upper }}" # | upper --> To convert string to upper case

- name: lower case
  hosts: localhost
  vars:
    greeting: "Hello, Good Morning"
  tasks:
  - name: convert into lowercase
    ansible.builtin.debug:
      msg: "{{ greeting | lower }}" # | lower --> To convert string to lower case

- name: remove duplicates
  hosts: localhost
  vars:
    numbers: [1, 2, 3, 3, 4, 4, 5]
  tasks:
  - name: remove duplicate numbers
    ansible.builtin.debug:
      msg: "{{numbers | unique }}"  # | unique is used to remove duplicates

- name: print min and max
  hosts: localhost
  vars:
    ages: [25, 35, 67, 89]
  tasks:
  - name: print min and max
    ansible.builtin.debug:
      msg: "Minimum age: {{ ages | min }}, and Maximum age: {{ ages | max }}"

- name: convert dictionary into items/list
  hosts: localhost
  vars:
    my_dict:  # this is called as dictionary or map or key/value pair
      Course: Ansible
      Trainer: Sai Praveen
      Duration: 120hrs
  tasks:
  - name: Before Converting 
    ansible.builtin.debug:
      msg: "Before conversion dictionary {{my_dict}}"
  - name: After Converting
    ansible.builtin.debug:
      msg: "Converting dictionary {{my_dict | dict2items}} "  